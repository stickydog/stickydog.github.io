<style>
/* Layout idea: a drafting-table stage — structure drawing on the left, the matrix board on the right, a chapter stepper on top. */
:root{
  --paper:#eef2f5;
  --panel:#ffffff;
  --ink:#18222d;
  --muted:#5a6878;
  --line:#d3dbe3;
  --accent:#255b8f;
  --accent-soft:#e1ecf6;
  --tint:#e4e9ee;
  --bar13:#2f6fb5;
  --bar23:#c97a1e;
  --bar34:#13897b;
  --bar24:#8657c4;
  --tension:#c4412f;
  --compress:#2d74c9;
  --fixed:#a7b2be;
  --font-display:"Noto Serif SC","Songti SC",serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151b; --panel:#17202a; --ink:#e2e8ee; --muted:#93a2b2; --line:#2a3644;
    --accent:#86b6e6; --accent-soft:#1d2d3e; --tint:#1c2530;
    --bar13:#6aa6ea; --bar23:#e9a650; --bar34:#47c2b1; --bar24:#b28ced;
    --tension:#ef7a68; --compress:#6aa6ea; --fixed:#4a5765;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151b; --panel:#17202a; --ink:#e2e8ee; --muted:#93a2b2; --line:#2a3644;
  --accent:#86b6e6; --accent-soft:#1d2d3e; --tint:#1c2530;
  --bar13:#6aa6ea; --bar23:#e9a650; --bar34:#47c2b1; --bar24:#b28ced;
  --tension:#ef7a68; --compress:#6aa6ea; --fixed:#4a5765;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 40px}
header h1{font-family:var(--font-display);font-size:26px;margin:0 0 4px;text-wrap:balance;letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:14px}
.crumb{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;font-size:14px}
.crumb a{color:var(--accent);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.mono{font-family:var(--font-mono)}

nav.chapters{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 12px}
nav.chapters button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
nav.chapters button .n{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
nav.chapters button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
nav.chapters button[aria-current="true"] .n{color:var(--panel);opacity:.8}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.figure{position:sticky;top:12px}
.figure svg{width:100%;height:auto;display:block}
.board{min-height:520px}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.controls button{font:inherit;font-size:14px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.controls button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}

.dots{display:flex;gap:5px;margin-left:auto;align-items:center}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}

.board p{margin:6px 0;max-width:62ch}

.mgrid .hd{color:var(--muted);text-align:center;padding:2px 0;font-size:12px}

.mgrid .c.bl{margin-left:4px}
.mgrid .c.bt{margin-top:4px}
.mgrid .hd.bl{margin-left:4px}
.mgrid .hd.bt{margin-top:4px}
.mgrid .c.hl{box-shadow:inset 0 0 0 2px var(--hl)}

/* new: forces & second order */
.ov-fade{animation:ovIn .6s ease}

.mini-chart text{font-family:var(--font-math);font-size:12px;fill:var(--muted)}
.readout{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14.5px;margin:8px 0}

<div class="wrap">
  <header>
    <nav class="crumb" aria-label="导航"><a href="../">← 首页</a><a href="index.html">结构与材料</a><a href="course-notes.html#ch14-6">笔记 §14.6 块矩阵与组装</a><a href="exercises.html#l7-3">习题 Lecture 7 例 3</a><a href="exercises.html#l7-5">习题 Lecture 7 例 5（固有频率）</a></nav>
    <h1>桁架刚度法动画演示</h1>
    <p>例题：铝制桁架，E = 70 GPa，A = 50 mm²，L = 1 m，F = 850 N。按章节一步步看单元矩阵怎么来、怎么组装、怎么求解，再由位移求杆力，最后组装质量矩阵、求固有频率和振型（ρ = 2.7 t/m³）。</p>
  </header>

  <nav class="chapters" id="chapters" aria-label="章节"></nav>

  <div class="stage">
    <div class="card figure">
      <svg id="fig" viewBox="50 50 620 410" role="img" aria-label="桁架结构图">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="6" height="6" fill="var(--panel)"/>
            <line x1="0" y1="0" x2="0" y2="6" stroke="var(--muted)" stroke-width="2"/>
          </pattern>
          <marker id="mFree" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
          <marker id="mFixed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fixed)"/></marker>
          <marker id="mInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
          <marker id="mLoad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--tension)"/></marker>
        </defs>

        <!-- supports -->
        <g class="support">
          <rect x="78" y="68" width="12" height="84" fill="url(#hatch)" stroke="var(--muted)"/>
          <line x1="140" y1="110" x2="90" y2="80"/><line x1="140" y1="110" x2="90" y2="140"/>
          <rect x="78" y="288" width="12" height="84" fill="url(#hatch)" stroke="var(--muted)"/>
          <line x1="140" y1="330" x2="90" y2="300"/><line x1="140" y1="330" x2="90" y2="360"/>
          <line x1="580" y1="330" x2="628" y2="298"/><line x1="580" y1="330" x2="628" y2="362"/>
          <line x1="628" y1="290" x2="628" y2="370"/>
          <line x1="642" y1="280" x2="642" y2="380" stroke-width="3"/>
        </g>
        <line x1="140" y1="122" x2="140" y2="318" stroke="var(--muted)" stroke-dasharray="5 5" stroke-width="1.4"/>

        <!-- undeformed bars -->

        <!-- load -->

          <line x1="580" y1="344" x2="580" y2="408" stroke="var(--tension)" stroke-width="4" marker-end="url(#mLoad)"/>
          <text x="594" y="404" class="flabel" fill="var(--tension)" data-math>F</text>

<script>
(function(){
  "use strict";
  // ---------- model ----------
  const EA = 70e9*50e-6;          // N
  const Lm = 1, F = 850;
  const delta = F*Lm/EA;          // m
  const S2 = Math.SQRT2;
  const P = {1:[0,1],2:[0,0],3:[1,1],4:[2,0]};
  const px = (X)=>140+X*220, py=(Y)=>330-Y*220;
  const DOF = ["u₁","v₁","u₂","v₂","u₃","v₃","u₄","v₄"];
  const FREE = [4,5,7];
  const bars = [
    {id:"13",i:1,j:3,k:{a:1,b:0},Le:"L",kLabel:"a",color:"var(--bar13)"},
    {id:"23",i:2,j:3,k:{a:0,b:1},Le:"√2 L",kLabel:"b",color:"var(--bar23)"},
    {id:"34",i:3,j:4,k:{a:0,b:1},Le:"√2 L",kLabel:"b",color:"var(--bar34)"},
    {id:"24",i:2,j:4,k:{a:.5,b:0},Le:"2L",kLabel:"a/2",color:"var(--bar24)"}
  ];
  bars.forEach(b=>{
    const dx=P[b.j][0]-P[b.i][0], dy=P[b.j][1]-P[b.i][1], l=Math.hypot(dx,dy);
    b.c=dx/l; b.s=dy/l;
    const k0=[[b.c*b.c,b.c*b.s],[b.c*b.s,b.s*b.s]];
    b.k0=k0;
  });
  const cs = (v)=>{ const r=Math.round(v*1e6)/1e6; if(r===1)return"1"; if(r===-1)return"−1"; if(Math.abs(r-1/S2)<1e-5)return"1/√2"; if(Math.abs(r+1/S2)<1e-5)return"−1/√2"; return r===0?"0":String(r); };
  const k0Text = (b)=>{
    // k0 = kfac * [c² cs; cs s²] written with integer matrix where possible
    const m=b.k0.map(r=>r.map(x=>Math.round(x*2)));   // values in halves
    const half = m.flat().some(x=>Math.abs(x)===1);
    const fac = half ? (b.kLabel==="b"?"(b/2)":b.kLabel==="a"?"(a/2)":"(a/4)") : (b.kLabel.includes("/")?"("+b.kLabel+")":b.kLabel);
    const mm = half ? m : m.map(r=>r.map(x=>x/2));
    const f=x=>x<0?"−"+(-x):String(x);
    return fac+"·["+f(mm[0][0])+" "+f(mm[0][1])+"; "+f(mm[1][0])+" "+f(mm[1][1])+"]";
  };

  const mini=(fac,m)=>`<span class="mini">${fac?`<span>${fac}</span>`:""}<span class="mm" style="grid-template-columns:repeat(${m[0].length},auto)">${m.flat().map(x=>`<span>${x}</span>`).join("")}</span></span>`;
  const k0Mini=(b)=>{
    const m=b.k0.map(r=>r.map(x=>Math.round(x*2)));
    const half=m.flat().some(x=>Math.abs(x)===1);
    const fac= half ? (b.kLabel==="b"?"b/2 ·":b.kLabel==="a"?"a/2 ·":"a/4 ·") : b.kLabel+" ·";
    const mm= half? m : m.map(r=>r.map(x=>x/2));
    return mini(fac, mm.map(r=>r.map(x=>x<0?"−"+(-x):String(x))));
  };
  // global K accumulation, entries as {a,b}
  function emptyK(){return Array.from({length:8},()=>Array.from({length:8},()=>({a:0,b:0,pips:[]})));}
  function addBar(K,b){
    const idx=[2*(b.i-1),2*(b.i-1)+1,2*(b.j-1),2*(b.j-1)+1];
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      const sign=((r<2)===(c<2))?1:-1;
      const v=sign*b.k0[r%2][c%2];
      if(Math.abs(v)<1e-9)continue;
      const e=K[idx[r]][idx[c]];
      e.a+=v*b.k.a; e.b+=v*b.k.b; e.pips.push(b.color);
    }
    return idx;
  }
  function fmt(e){
    const parts=[];
    [["a",e.a],["b",e.b]].forEach(([s,v])=>{
      v=Math.round(v*1e6)/1e6; if(Math.abs(v)<1e-9)return;
      const av=Math.abs(v);
      const t = av===1?s : av===.5?s+"/2" : av===.25?s+"/4" : av===2?"2"+s : av+s;
      parts.push({neg:v<0,t});
    });
    if(!parts.length)return "0";
    return parts.map((p,k)=> k===0 ? (p.neg?"−":"")+p.t : (p.neg?" − ":"+")+p.t).join("");
  }

  // displacements (m)
  const u3=2*delta, v3=-(2+2*S2)*delta, v4=-(4+4*S2)*delta;
  const U={1:[0,0],2:[0,0],3:[u3,v3],4:[0,v4]};
  const N={ "13":2*F, "23":-S2*F, "34":S2*F, "24":0 };

  // ---------- math typesetting ----------
  const SUB={"ₓ":"x","ᵧ":"y","₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9","ₑ":"e"};

      </svg>`;
      setBoard(`<h2>节点 4 下沉了，杆 2–4 为什么没有内力？</h2>
        <p>严格按几何算，杆 2–4 确实变长了：新长度 √((2L)² + v₄²) ≈ 2L + v₄²/(4L)。但这个伸长量是位移的<b>二阶小量</b>。线性刚度法只保留一阶项 Δ = eᵀ(u_j − u_i)，竖直位移垂直于水平杆轴，一阶伸长为 0。</p>
        <div class="slider"><label for="theta">示意转角 θ（夸大）</label><input id="theta" type="range" min="0" max="28" step="1" value="20"><span class="mono" id="thetaval">20°</span></div>
        <dl class="readout" id="ro"></dl>
        <p>左图：线性理论里节点 4 沿<b>切线</b>竖直移动；长度不变的位置在<b>圆弧</b>上。两者之差（红色）就是真实伸长，它随 θ² 增长，θ 很小时可以忽略。</p>
        <h2 style="font-size:16px;margin-top:14px">本题的实际数值</h2>
        <dl class="readout">
          <dt>转角</dt><dd>θ = v₄/(2L) = 2.345/2000 ≈ 0.067°</dd>
          <dt>二阶伸长</dt><dd>Δ ≈ v₄²/(4L) = 2.345²/4000 ≈ 0.0014 mm</dd>
          <dt>对应内力</dt><dd>N ≈ 1750 N/mm × 0.0014 mm ≈ 2.4 N（其他杆 1202–1700 N）</dd>
        </dl>
        <div id="rawslot"></div>
        <p class="note">红线是杆 2–4 的真实伸长随 |v₄| 的变化，虚线是其他杆的一阶伸长。只有 |v₄| 大到约 ${vx.toFixed(0)} mm（本题的 ${ (vx/2.345).toFixed(0)} 倍）时，二者才相当；那时就要做几何非线性（大变形）分析，在变形后的构形上重新列平衡。</p>`);
      document.getElementById("rawslot").innerHTML=chart;
      const th=document.getElementById("theta"), tv=document.getElementById("thetaval"), ro=document.getElementById("ro");
      const upd=()=>{const d=+th.value, t=d*Math.PI/180; tv.textContent=d+"°"; drawGeo(d);
        ro.innerHTML=prettify(`<dt>v₄ / 2L</dt><dd>tan θ = ${Math.tan(t).toFixed(3)}</dd><dt>线性理论 Δ</dt><dd>0</dd><dt>真实 Δ / 2L</dt><dd>1/cos θ − 1 = ${(1/Math.cos(t)-1).toFixed(4)}（≈ θ²/2 = ${(t*t/2).toFixed(4)}）</dd>`);};
      th.addEventListener("input",upd); upd();
    }},
    {title:"质量矩阵", steps:5, noLoad:true, draw(step,fwd){
      gDofs.classList.add("hidden"); gDef.classList.add("hidden"); showEvec(null); setBarFocus(null);
      const g=el("g",{class:"ov-fade"},gOv);
      const dimExcept=ids=>bars.forEach(b=>{const d=!ids.includes(b.id); barEls[b.id].classList.toggle("dim",d); labelEls[b.id].style.opacity=d?.25:1;});
      if(step===0){
        setBoard(`<h2>Task 3/4：先组装质量矩阵 M</h2>
          <p>自由振动方程 M·ü + K·u = 0，设 u = φ·sin ωt，得到 (K − ω²M)·φ = 0，固有频率由 det(K − ω²M) = 0 求出。自由度仍是 u₃、v₃、v₄，K 沿用前面的结果。</p>
          <div class="calc"><div>一致质量（课件写法，轴向形函数转到整体坐标）：</div><div>m_e = (ρALₑ/6) · [ 2eeᵀ　eeᵀ ; eeᵀ　2eeᵀ ]</div><div>对比刚度：k_e = (EA/Lₑ) · [ eeᵀ　−eeᵀ ; −eeᵀ　eeᵀ ]</div></div>
          <p>块结构和刚度矩阵完全一样，所以照样“看图填块”：对角块加 (ρALₑ/3)·eeᵀ，耦合块加 <b>+</b>(ρALₑ/6)·eeᵀ（注意是正号）。</p>
          <p class="note">单位用 N–mm–t：ρ = 2.7×10⁻⁹ t/mm³，μ = ρAL = 2.7×10⁻⁹ × 50 × 1000 = 1.35×10⁻⁴ t（一根长 L 的杆的质量）。这样 K（N/mm）÷ M（t）得到 s⁻²。</p>`);
        return;
      }
      if(step===1){
        dimExcept(["13","23","34"]);
        el("circle",{cx:XY(3)[0],cy:XY(3)[1],r:30,fill:"none",stroke:"var(--accent)","stroke-width":2.5,"stroke-dasharray":"6 4"},g);
        setBoard(`<h2>一致质量：节点 3 的对角块</h2>
          <p>节点 3 连着杆 1–3、2–3、3–4，各加 (ρALₑ/3)·eeᵀ：</p>
          <div class="calc"><div>杆 1–3：(μ/3)·[1 0; 0 0]</div><div>杆 2–3：(√2 μ/3)·½·[1 1; 1 1] = (μ/(3√2))·[1 1; 1 1]</div><div>杆 3–4：(μ/(3√2))·[1 −1; −1 1]</div><div>合计：M₃₃ = [ μ/3 + √2 μ/3　0 ; 0　√2 μ/3 ]</div></div>
          <p class="note">两根斜杆的 cs 项一正一负，耦合项正好抵消，和刚度矩阵的情况一样。</p>`);
        return;
      }
      if(step===2){
        dimExcept(["34","24"]);
        el("circle",{cx:XY(4)[0],cy:XY(4)[1],r:30,fill:"none",stroke:"var(--accent)","stroke-width":2.5,"stroke-dasharray":"6 4"},g);
        const Mc=[["2√2+4","0","−1"],["0","4","1"],["−1","1","2"]];
        setBoard(`<h2>一致质量：节点 4 与耦合块 → M_c</h2>
          <div class="calc"><div>v₄v₄：杆 3–4 给 (√2 μ/3)·½ = μ/(3√2)；杆 2–4 水平，s = 0，贡献 0</div><div>耦合块 3–4：+(√2 μ/6)·½·[1 −1; −1 1]，取 v₄ 列 → (−μ/(6√2), +μ/(6√2))</div></div>
          <p>记 m* = μ/(6√2) = 1.591×10⁻⁵ t：</p>
          <div class="sys grow"><span>M_c = m* ·</span>${matHTML(Mc)}<span>= 10⁻⁵ ·</span>${matHTML([["10.864","0","−1.591"],["0","6.364","1.591"],["−1.591","1.591","3.182"]])}<span>t</span></div>
          <p class="note">和 K 一样对称；但非对角元的正负和 K 不同，因为质量矩阵的耦合块是 +eeᵀ。</p>`);
        return;
      }
      if(step===3){
        // lumped: half of each bar mass to each end
        bars.forEach(b=>{const m=Le(b)/1000; [[b.i,b.j],[b.j,b.i]].forEach(([n,o])=>{const [x,y]=XY(n),[xo,yo]=XY(o);
          const t=0.2, cx=x+(xo-x)*t, cy=y+(yo-y)*t; el("circle",{cx,cy,r:7*Math.sqrt(m),fill:b.color,opacity:(n===1||n===2)?.3:.95},g);});});
        [[3,"m₃ = μ(½ + √2)",30,-10,"start"],[4,"m₄ = μ(1 + √2/2)",-12,-30,"end"]].forEach(([n,t,dx,dy,an])=>{const [x,y]=XY(n);
          el("circle",{cx:x,cy:y,r:22,fill:"none",stroke:"var(--accent)","stroke-width":2.5},g); label(g,x+dx,y+dy,t,"var(--accent)",an);});
        setBoard(`<h2>集中质量：每根杆的质量对半分到两端</h2>
          <p>集中质量矩阵 m_e = (ρALₑ/2)·I，x、y 方向都一样。图中彩色圆点是每根杆分到各端的一半质量，节点质量就是这些圆点之和。</p>
          <div class="calc"><div>节点 3：μ/2 + √2 μ/2 + √2 μ/2 = μ(½ + √2) = 2.584×10⁻⁴ t</div><div>节点 4：√2 μ/2 + μ = μ(1 + √2/2) = 2.305×10⁻⁴ t</div></div>
          <div class="sys grow"><span>M_l = μ ·</span>${matHTML([["½+√2","0","0"],["0","½+√2","0"],["0","0","1+√2/2"]])}</div>
          <p class="note">节点 1、2 上的半质量（浅色）对应的位移为 0，和刚度矩阵一样划掉，不进入 M。</p>`);
        return;
      }
      setBoard(`<h2>两种质量矩阵对比</h2>
        <div class="sys">${matHTML([["10.864","0","−1.591"],["0","6.364","1.591"],["−1.591","1.591","3.182"]])}<span>vs</span>${matHTML([["25.84","0","0"],["0","25.84","0"],["0","0","23.05"]])}<span>×10⁻⁵ t</span></div>
        <table class="t"><tr><th></th><th>一致质量 M_c</th><th>集中质量 M_l</th></tr>
        <tr><td>形状</td><td>满阵，有耦合</td><td>对角阵</td></tr>
        <tr><td>来源</td><td>与 K 同一套形函数</td><td>质量直接堆在节点</td></tr>
        <tr><td>频率</td><td>精确值的上界（偏高）</td><td>通常偏低</td></tr>
        <tr><td>对角元之和</td><td>20.41×10⁻⁵ t</td><td>74.73×10⁻⁵ t</td></tr></table>
        <p class="note">课件的一致质量只计沿杆轴方向的惯性，垂直于杆的运动没有质量，所以 M_c 的对角元比 M_l 小得多，频率也就高得多。</p>`);
    }},
    {title:"固有频率与振型", steps:3, noLoad:true, draw(step,fwd){
      gDofs.classList.add("hidden"); gDef.classList.add("hidden"); showEvec(null); setBarFocus(null);
      if(step===0){
        setBoard(`<h2>一致质量：特征方程与频率</h2>
          <p>K = k*·K̂，M_c = m*·M̂，其中 k* = EA/(2√2 L) = 1237.4 N/mm。令 ω² = (k*/m*)·Λ，k*/m* = 3EA/(ρAL²) = 7.778×10⁷ s⁻²：</p>
          <div class="sys">${matHTML([["2√2+2","0","1"],["0","2","−1"],["1","−1","1"]])}<span>− Λ</span>${matHTML([["2√2+4","0","−1"],["0","4","1"],["−1","1","2"]])}<span>→ det = 0</span></div>
          <div class="calc"><div>(24 + 14√2)Λ³ − (60 + 34√2)Λ² + (24 + 22√2)Λ − 2√2 = 0</div><div>43.799Λ³ − 108.083Λ² + 55.113Λ − 2.828 = 0</div></div>
          <table class="t"><tr><th>阶</th><th>Λ</th><th>ω (rad/s)</th><th>f = ω/2π</th></tr>
          ${MODES.c.L.map((L,k)=>`<tr><td>${k+1}</td><td>${L}</td><td>${MODES.c.w[k]}</td><td><b>${MODES.c.f[k]} Hz</b></td></tr>`).join("")}</table>
          <p class="note">自检：三根之和 = 108.083/43.799 = 2.4677 = 0.0577 + 0.6281 + 1.7819 ✓</p>`);
        drawMode(MODES.c.v[0],0); return;
      }
      if(step===1){
        setBoard(`<h2>集中质量：特征方程与频率</h2>
          <p>M_l = μ·diag(½+√2, ½+√2, 1+√2/2)。令 ω² = (k*/μ)·Λ，k*/μ = 9.166×10⁶ s⁻²：</p>
          <div class="calc"><div>(13/4 + 17√2/8)Λ³ − (53/4 + 9√2)Λ² + (13 + 9√2)Λ − 2√2 = 0</div><div>6.255Λ³ − 25.978Λ² + 25.728Λ − 2.828 = 0</div></div>
          <table class="t"><tr><th>阶</th><th>Λ</th><th>ω (rad/s)</th><th>f</th><th>一致质量</th></tr>
          ${MODES.l.L.map((L,k)=>`<tr><td>${k+1}</td><td>${L}</td><td>${MODES.l.w[k]}</td><td><b>${MODES.l.f[k]} Hz</b></td><td>${MODES.c.f[k]} Hz</td></tr>`).join("")}</table>
          <p class="note">集中质量的频率全部低于一致质量。网格很粗（每杆一个单元），且课件一致质量不含横向惯性，所以差别很大；加密网格后两者都收敛到精确解。</p>`);
        drawMode(MODES.l.v[0],0); return;
      }
      let kind="c", mode=0, play=!matchMedia("(prefers-reduced-motion: reduce)").matches;
      setBoard(`<h2>振型动画（mode shapes）</h2>
        <p>每阶固有频率对应一个振型 φ：结构按这个形状同步振动。图中振幅已放大，动画速度只示意各阶快慢，不是真实频率。</p>
        <div class="controls" style="margin-top:4px" id="kindbtns"><button type="button" data-k="c">一致质量</button><button type="button" data-k="l">集中质量</button></div>
        <div class="controls" style="margin-top:6px" id="modebtns"><button type="button" data-m="0">第 1 阶</button><button type="button" data-m="1">第 2 阶</button><button type="button" data-m="2">第 3 阶</button><button type="button" id="mplay"></button></div>
        <div id="modeinfo"></div>`);
      const info=document.getElementById("modeinfo"), mplay=document.getElementById("mplay");
      const desc={c:["节点 4 竖直振动为主，节点 3 跟着向右下摆","节点 3 斜向（右上–左下）振动为主，节点 4 反向小幅运动","节点 3 与节点 4 竖直方向反相振动"],
                  l:["节点 4 竖直振动为主，节点 3 跟着向右下摆","节点 3 竖直振动为主，节点 4 反向运动","节点 3 水平振动为主"]};
      function refresh(){
        document.querySelectorAll("#kindbtns button").forEach(b=>b.classList.toggle("primary",b.dataset.k===kind));
        document.querySelectorAll("#modebtns button[data-m]").forEach(b=>b.classList.toggle("primary",+b.dataset.m===mode));
        mplay.textContent=play?"暂停":"播放";
        const M=MODES[kind], v=M.v[mode];
        info.innerHTML=prettify(`<table class="t"><tr><th>${M.name} · 第 ${mode+1} 阶</th><th>f = ${M.f[mode]} Hz</th></tr>
          <tr><td>振型 φ = (u₃, v₃, v₄)</td><td>(${v.map(x=>String(x).replace("-","−")).join(", ")})</td></tr></table>
          <p>${desc[kind][mode]}。</p>
          <table class="t"><tr><th>阶</th><th>一致质量</th><th>集中质量</th></tr>${[0,1,2].map(k=>`<tr${k===mode?' class="cur"':''}><td>${k+1}</td><td>${MODES.c.f[k]} Hz</td><td>${MODES.l.f[k]} Hz</td></tr>`).join("")}</table>`);
        stopMode();
        const period=1800*Math.sqrt(MODES[kind].f[0]/MODES[kind].f[mode]);
        if(play){ const t0=performance.now(); const tick=t=>{drawMode(v,60*Math.sin(2*Math.PI*(t-t0)/period)); modeRaf=requestAnimationFrame(tick);}; modeRaf=requestAnimationFrame(tick); }
        else drawMode(v,60);
      }
      document.querySelectorAll("#kindbtns button").forEach(b=>b.addEventListener("click",()=>{kind=b.dataset.k;refresh();}));
      document.querySelectorAll("#modebtns button[data-m]").forEach(b=>b.addEventListener("click",()=>{mode=+b.dataset.m;refresh();}));
      mplay.addEventListener("click",()=>{play=!play;refresh();});
      bars.forEach(b=>{barEls[b.id].classList.add("dim");labelEls[b.id].style.opacity=.2;});
      refresh();
    }}
  ];

  // ---------- navigation ----------
  let si=0, st=0, autoTimer=null;
  const nav=document.getElementById("chapters");
  scenes.forEach((s,k)=>{
    const b=document.createElement("button"); b.type="button";
    b.innerHTML=prettify(`<span class="n">${k+1}</span><span>${s.title}</span>`);
    b.addEventListener("click",()=>{stopAuto();go(k,0,false);});
    nav.appendChild(b);
  });
  const prevB=document.getElementById("prev"), nextB=document.getElementById("next"), autoB=document.getElementById("auto");
  function go(s,t,fwd){
    stopMode();
    if(!scenes[s].deform) stopPlay();
    gLoad.classList.toggle("hidden", !!(scenes[s].noLoad||scenes[s].deform));
    gOv.innerHTML="";
    fig.setAttribute("viewBox", scenes[s].vb || "50 50 620 410");
    bars.forEach(b=>{barEls[b.id].classList.remove("dim");});
    si=s; st=t;
    [...nav.children].forEach((b,k)=>b.setAttribute("aria-current",k===si?"true":"false"));
    scenes[si].draw(st,fwd);
    const dots=document.getElementById("dots"); dots.innerHTML="";
    for(let k=0;k<scenes[si].steps;k++){const d=document.createElement("span");d.className=k===st?"on":k<st?"done":"";dots.appendChild(d);}
    document.getElementById("stepnum").innerHTML=prettify(`第 ${si+1} 章「${scenes[si].title}」 · 步骤 ${st+1} / ${scenes[si].steps}   （键盘 ← → 也可以翻页）`);
    prevB.disabled = si===0&&st===0;
    nextB.disabled = si===scenes.length-1&&st===scenes[si].steps-1;
  }
  function next(){
    if(st<scenes[si].steps-1) go(si,st+1,true);
    else if(si<scenes.length-1) go(si+1,0,true);
    else stopAuto();
  }
  function prev(){
    if(st>0) go(si,st-1,false);
    else if(si>0) go(si-1,scenes[si-1].steps-1,false);
  }
  function stopAuto(){ if(autoTimer){clearInterval(autoTimer);autoTimer=null;} autoB.textContent="自动播放"; }
  prevB.addEventListener("click",()=>{stopAuto();prev();});
  nextB.addEventListener("click",()=>{stopAuto();next();});
  autoB.addEventListener("click",()=>{
    if(autoTimer){stopAuto();return;}
    autoB.textContent="暂停"; next();
    autoTimer=setInterval(()=>{ if(nextB.disabled){stopAuto();return;} next(); },3200);
  });
  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT")return;
    if(e.key==="ArrowRight"){stopAuto();next();}
    if(e.key==="ArrowLeft"){stopAuto();prev();}
  });
  document.querySelectorAll("[data-math]").forEach(t=>svgMath(t,t.textContent));
  const hp=document.querySelector("header p"); hp.innerHTML=prettify(hp.innerHTML);
  go(0,0,false);
})();
</script>
</body>
</html>
