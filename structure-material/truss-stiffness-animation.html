    <h1>桁架刚度法动画演示</h1>
    <p>例题：铝制桁架，E = 70 GPa，A = 50 mm²，ρ = 2.7 t/m³，L = 1 m，F = 850 N。依次演示 Task 1 的静力分析（自由度、单元刚度矩阵、组装、求位移、杆力与支反力）和 Task 3/4 的动力分析（质量矩阵、固有频率与振型）。</p>

<script>
(function(){
  "use strict";
  // ---------- model ----------
  const EA = 70e9*50e-6;          // N
  const Lm = 1, F = 850;
  const delta = F*Lm/EA;          // m
  const S2 = Math.SQRT2;
  const P = {1:[0,1],2:[0,0],3:[1,1],4:[2,0]};
  const px = (X)=>140+X*220, py=(Y)=>330-Y*220;
  const DOF = ["u₁","v₁","u₂","v₂","u₃","v₃","u₄","v₄"];
  const FREE = [4,5,7];
  const bars = [
    {id:"13",i:1,j:3,k:{a:1,b:0},Le:"L",kLabel:"a",color:"var(--bar13)"},
    {id:"23",i:2,j:3,k:{a:0,b:1},Le:"√2 L",kLabel:"b",color:"var(--bar23)"},
    {id:"34",i:3,j:4,k:{a:0,b:1},Le:"√2 L",kLabel:"b",color:"var(--bar34)"},
    {id:"24",i:2,j:4,k:{a:.5,b:0},Le:"2L",kLabel:"a/2",color:"var(--bar24)"}
  ];
  bars.forEach(b=>{
    const dx=P[b.j][0]-P[b.i][0], dy=P[b.j][1]-P[b.i][1], l=Math.hypot(dx,dy);
    b.c=dx/l; b.s=dy/l;
    const k0=[[b.c*b.c,b.c*b.s],[b.c*b.s,b.s*b.s]];
    b.k0=k0;
  });
  const cs = (v)=>{ const r=Math.round(v*1e6)/1e6; if(r===1)return"1"; if(r===-1)return"−1"; if(Math.abs(r-1/S2)<1e-5)return"1/√2"; if(Math.abs(r+1/S2)<1e-5)return"−1/√2"; return r===0?"0":String(r); };
  const k0Text = (b)=>{
    // k0 = kfac * [c² cs; cs s²] written with integer matrix where possible
    const m=b.k0.map(r=>r.map(x=>Math.round(x*2)));   // values in halves
    const half = m.flat().some(x=>Math.abs(x)===1);
    const fac = half ? (b.kLabel==="b"?"(b/2)":b.kLabel==="a"?"(a/2)":"(a/4)") : (b.kLabel.includes("/")?"("+b.kLabel+")":b.kLabel);
    const mm = half ? m : m.map(r=>r.map(x=>x/2));
    const f=x=>x<0?"−"+(-x):String(x);
    return fac+"·["+f(mm[0][0])+" "+f(mm[0][1])+"; "+f(mm[1][0])+" "+f(mm[1][1])+"]";
  };

  const mini=(fac,m)=>`<span class="mini">${fac?`<span>${fac}</span>`:""}<span class="mm" style="grid-template-columns:repeat(${m[0].length},auto)">${m.flat().map(x=>`<span>${x}</span>`).join("")}</span></span>`;
  const k0Mini=(b)=>{
    const m=b.k0.map(r=>r.map(x=>Math.round(x*2)));
    const half=m.flat().some(x=>Math.abs(x)===1);
    const fac= half ? (b.kLabel==="b"?"b/2 ·":b.kLabel==="a"?"a/2 ·":"a/4 ·") : b.kLabel+" ·";
    const mm= half? m : m.map(r=>r.map(x=>x/2));
    return mini(fac, mm.map(r=>r.map(x=>x<0?"−"+(-x):String(x))));
  };
  // global K accumulation, entries as {a,b}
  function emptyK(){return Array.from({length:8},()=>Array.from({length:8},()=>({a:0,b:0,pips:[]})));}
  function addBar(K,b){
    const idx=[2*(b.i-1),2*(b.i-1)+1,2*(b.j-1),2*(b.j-1)+1];
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      const sign=((r<2)===(c<2))?1:-1;
      const v=sign*b.k0[r%2][c%2];
      if(Math.abs(v)<1e-9)continue;
      const e=K[idx[r]][idx[c]];
      e.a+=v*b.k.a; e.b+=v*b.k.b; e.pips.push(b.color);
    }
    return idx;
  }
  function fmt(e){
    const parts=[];
    [["a",e.a],["b",e.b]].forEach(([s,v])=>{

    {title:"杆力与支反力", steps:10, vb:"50 40 620 500", noLoad:true, draw(step,fwd){

      if(step<=4){

        let nx=-ey, ny=ex; const cr=(tx-xj)*nx+(ty-yj)*ny; if(cr<0){nx=-nx;ny=-ny;}

        const fx=ox+ex*mmv(D)*DS, fy=oy+ey*mmv(D)*DS;
        el("line",{x1:tx,y1:ty,x2:fx,y2:fy,stroke:"var(--muted)","stroke-width":1.3,"stroke-dasharray":"2 3"},g);

        label(g,tx+8,ty+14,"u_j − u_i","var(--ink)");
        if(Math.abs(D)>1e-12){ arrow(g,ox,oy,fx,fy,forceColor(Nn),5); label(g,fx+nx*14,fy+ny*14+4,"Δ",forceColor(Nn),"middle"); }
        else { el("circle",{cx:xj,cy:yj,r:6,fill:"none",stroke:"var(--muted)","stroke-width":2},g); label(g,xj-14,yj-18,"Δ = 0","var(--muted)","end"); }
        const rows=bars.slice(0,step).map((x,k)=>{const r=barDelta(x), n=EA/Le(x)*r.D; return `<tr class="${k===step-1?"cur"+(fwd?" enter":""):""}"><td><span class="sw" style="background:${x.color}"></span>${x.i}–${x.j}</td><td>${Math.abs(r.D)<1e-12?"0":fmtL(mmv(r.D))+" mm"}</td><td>${fmtNu(n)}</td><td>${Math.abs(n)<1e-6?"0":(n/50).toFixed(1).replace("-","−")+" MPa"}</td></tr>`;}).join("");
        const X={
          "13":{calc:String.raw`c=1,\quad s=0,\quad L_e=L\\ \Delta&=u_3-u_1=2\delta=0.486\ \text{mm}\\ N&=\frac{EA}{L}\,\Delta=3500\ \text{N/mm}\times0.486\ \text{mm}=+1700\ \text N`,note:String.raw`竖向位移 $v_3$ 垂直于杆轴，不影响伸长。`},
          "23":{calc:String.raw`c=s=\tfrac{1}{\sqrt2},\quad L_e=\sqrt2\,L\\ \Delta&=\frac{u_3+v_3}{\sqrt2}=\frac{\left[2-(2+2\sqrt2)\right]\delta}{\sqrt2}=-2\delta=-0.486\ \text{mm}\\ N&=\frac{EA}{\sqrt2\,L}\,\Delta=2475\ \text{N/mm}\times(-0.486\ \text{mm})=-1202\ \text N`,note:"节点 3 向下的位移比向右的大，沿杆轴方向是在靠近节点 2，所以杆被压短。"},
          "34":{calc:String.raw`c=\tfrac{1}{\sqrt2},\quad s=-\tfrac{1}{\sqrt2},\quad L_e=\sqrt2\,L\\ \Delta&=\frac{(u_4-u_3)-(v_4-v_3)}{\sqrt2}=2\delta=0.486\ \text{mm}\\ N&=\frac{EA}{\sqrt2\,L}\,\Delta=2475\ \text{N/mm}\times0.486\ \text{mm}=+1202\ \text N`,note:"节点 4 比节点 3 下沉得多，沿杆轴方向两端在远离，所以杆被拉长。"},
          "24":{calc:String.raw`c=1,\quad s=0,\quad L_e=2L\\ \Delta&=u_4-u_2=0-0=0\\ N&=0`,note:"节点 4 的位移是竖直的，正好垂直于这根水平杆。一阶近似下杆只转动、不伸长。"}}[b.id];
        const [first,...rest]=X.calc.split(String.raw`\\ `);
        setBoard(String.raw`<h2>杆 ${b.i}→${b.j}：$N=${Math.abs(Nn)<1e-6?"0":(Nn>0?"+":"-")+Math.round(Math.abs(Nn))+String.raw`\ \text N`}$ ${stateChip(Nn)}</h2>
          <p>相对位移 $\mathbf u_j-\mathbf u_i=({${fmtL(mmv(du)).replace("−","-")}},\ {${fmtL(mmv(dv)).replace("−","-")}})$ mm</p>
          <div class="calc">$$${first}$$$$\begin{aligned}${rest.join(String.raw`\\ `)}\end{aligned}$$</div>

          <tr><td><span class="sw" style="background:var(--bar23)"></span>2–3</td><td>−1202 N</td><td>(+850, +850)</td></tr>
          <tr><td><span class="sw" style="background:var(--bar34)"></span>3–4</td><td>+1202 N</td><td>(+850, −850)</td></tr></table>
          <p>三个力首尾相接，回到起点（下图空心圆），合力为零 ✓</p><div id="rawslot"></div>`); document.getElementById("rawslot").innerHTML=svgPoly;
        return;
      }
      // steps 6-9: reactions by the method of sections
      const ink="var(--ink)";
      function cutForce(g,cx,cy,id,towardFB){ // force of a cut bar on the free body
        const n=N[id]; if(Math.abs(n)<1e-6){ label(g,cx+6,cy-8,"N = 0","var(--muted)"); el("circle",{cx,cy,r:4,fill:"var(--muted)"},g); return; }
        const [ux,uy]=towardFB; const sx=n*ux*FS, sy=n*uy*FS;
        const b=bars.find(x=>x.id===id);
        if(n>0) arrow(g,cx,cy,cx+sx,cy+sy,b.color,4); else arrow(g,cx-sx,cy-sy,cx,cy,b.color,4);
      }
      function reac(g,n,Rx,Ry,lab,lx,ly,anchor){ const [x,y]=XY(n);
        [[Rx,0],[0,Ry]].forEach(([a2,b2])=>{ if(!a2&&!b2)return; const sx=a2*FS, sy=-b2*FS; const L=Math.hypot(sx,sy), ux=sx/L, uy=sy/L;
          arrow(g, x-sx-ux*15, y-sy-uy*15, x-ux*15, y-uy*15, "var(--accent)",4); });

      const u23=[-1/S2, 1/S2]; // screen unit from node 3 toward node 2
      if(step===6){
        gLoad.classList.remove("hidden");

        label(g,250,62,"I","var(--ink)","middle"); label(g,250,418,"I","var(--ink)","middle");
        cutForce(g,250,110,"13",[-1,0]);
        cutForce(g,250,220,"23",u23);
        cutForce(g,250,330,"24",[-1,0]);
        reac(g,4,850,0,"R₄ₓ = ?",XY(4)[0]-14,XY(4)[1]+36,"end");
        setBoard(String.raw`<h2>截面 I–I：取右半部分求 $R_4$</h2>
          <p>截面法（又称截断法，method of sections）：用截面把结构切开，取一侧为隔离体，被切断的杆用已知轴力代替，再列平衡方程求支反力。</p>

          <div class="calc">$$\begin{aligned}\textstyle\sum F_x=0:&\quad N_{13}+R_{1x}=0\ \Rightarrow\ R_{1x}=-1700\ \text N\ (\text{向左})\\ \textstyle\sum F_y=0:&\quad R_{1y}=0\end{aligned}$$</div>

        setBoard(String.raw`<h2>截面 III：围住节点 2 求 $R_2$</h2>
          <p>闭合截面切断杆 2–3 和杆 2–4。杆 2–3 受压，力指向节点 2（左下方）；杆 2–4 为零力杆。</p>
          <div class="calc">$$\begin{aligned}\textstyle\sum F_x=0:&\quad \tfrac{N_{23}}{\sqrt2}+N_{24}+R_{2x}=0\ \Rightarrow\ -850+0+R_{2x}=0\ \Rightarrow\ R_{2x}=+850\ \text N\\ \textstyle\sum F_y=0:&\quad \tfrac{N_{23}}{\sqrt2}+R_{2y}=0\ \Rightarrow\ R_{2y}=+850\ \text N\end{aligned}$$</div>
          <p class="note">注意符号：杆 2–3 从节点 2 指向节点 3 的单位向量是 $(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2})$，所以杆对节点 2 的力为 $N_{23}\,(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2})=(-850,\,-850)$ N。</p>`);

        <p class="note">$R_2$ 作用在节点 2 上，$R_{4x}$ 的作用线经过节点 2，它们对节点 2 的力矩都为 0。</p>

        <p class="note">整体只有 3 个方程，却有 5 个支反力分量，单靠整体平衡求不出来；必须先有杆力，再用截面逐个求。也可以用矩阵 $\mathbf R=\mathbf K_{sf}\,\mathbf u_f$ 直接算，结果相同。</p>`);

      document.querySelectorAll("#modebtns button[data-m]").forEach(b=>b.addEventListener("click",()=>{mode=+b.dataset.m;refresh();}));
      mplay.addEventListener("click",()=>{play=!play;refresh();});
      bars.forEach(b=>{barEls[b.id].classList.add("dim");labelEls[b.id].style.opacity=.2;});
      refresh();
    }}
  ];

  // ---------- navigation ----------
  let si=0, st=0, autoTimer=null;
  const nav=document.getElementById("chapters");
  scenes.forEach((s,k)=>{
    const b=document.createElement("button"); b.type="button";
    b.innerHTML=prettify(`<span class="n">${k+1}</span><span>${s.title}</span>`);
    b.addEventListener("click",()=>{stopAuto();go(k,0,false);});
    nav.appendChild(b);
  });
  const prevB=document.getElementById("prev"), nextB=document.getElementById("next"), autoB=document.getElementById("auto");
  function go(s,t,fwd){
    stopMode();
    if(!scenes[s].deform) stopPlay();
    gLoad.classList.toggle("hidden", !!(scenes[s].noLoad||scenes[s].deform));
    gOv.innerHTML="";
    fig.setAttribute("viewBox", scenes[s].vb || "50 50 620 410");
    bars.forEach(b=>{barEls[b.id].classList.remove("dim");});
    si=s; st=t;
    [...nav.children].forEach((b,k)=>b.setAttribute("aria-current",k===si?"true":"false"));
    scenes[si].draw(st,fwd);
    const dots=document.getElementById("dots"); dots.innerHTML="";
    for(let k=0;k<scenes[si].steps;k++){const d=document.createElement("span");d.className=k===st?"on":k<st?"done":"";dots.appendChild(d);}
    document.getElementById("stepnum").innerHTML=prettify(`第 ${si+1} 章「${scenes[si].title}」 · 步骤 ${st+1} / ${scenes[si].steps}   （键盘 ← → 也可以翻页）`);
    prevB.disabled = si===0&&st===0;
    nextB.disabled = si===scenes.length-1&&st===scenes[si].steps-1;
  }
  function next(){
    if(st<scenes[si].steps-1) go(si,st+1,true);
    else if(si<scenes.length-1) go(si+1,0,true);
    else stopAuto();
  }
  function prev(){
    if(st>0) go(si,st-1,false);
    else if(si>0) go(si-1,scenes[si-1].steps-1,false);
  }
  function stopAuto(){ if(autoTimer){clearInterval(autoTimer);autoTimer=null;} autoB.textContent="自动播放"; }
  prevB.addEventListener("click",()=>{stopAuto();prev();});
  nextB.addEventListener("click",()=>{stopAuto();next();});
  autoB.addEventListener("click",()=>{
    if(autoTimer){stopAuto();return;}
    autoB.textContent="暂停"; next();
    autoTimer=setInterval(()=>{ if(nextB.disabled){stopAuto();return;} next(); },3200);
  });
  document.addEventListener("keydown",e=>{
    if(e.target.tagName==="INPUT")return;
    if(e.key==="ArrowRight"){stopAuto();next();}
    if(e.key==="ArrowLeft"){stopAuto();prev();}
  });
  document.querySelectorAll("[data-math]").forEach(t=>svgMath(t,t.textContent));
  const hp=document.querySelector("header p"); hp.innerHTML=prettify(hp.innerHTML);
  go(0,0,false);
})();
</script>
</body>
</html>
